<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>tinyizer benchmarks</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;padding:2rem;max-width:900px;margin:0 auto}
  h1{font-size:1.5rem;margin-bottom:.5rem;color:#58a6ff}
  p.sub{color:#8b949e;font-size:.85rem;margin-bottom:2rem}
  .chart-wrap{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:1.5rem;margin-bottom:2rem}
  .chart-wrap h2{font-size:1rem;color:#c9d1d9;margin-bottom:1rem}
  canvas{max-height:350px}
  table{width:100%;border-collapse:collapse;background:#161b22;border:1px solid #30363d;border-radius:6px;overflow:hidden}
  th,td{padding:.5rem .75rem;text-align:right;font-size:.85rem}
  th{background:#21262d;color:#8b949e;font-weight:600}
  td{color:#c9d1d9;border-top:1px solid #30363d}
  td:first-child,th:first-child{text-align:left}
   .win{color:#3fb950;font-weight:700}
   .lose{color:#f85149}
   .delta{font-size:.75rem;margin-left:3px}
   .delta.down{color:#3fb950}
   .delta.up{color:#f85149}
   .delta.flat{color:#484f58}
   .sparkline svg{display:block}
  footer{text-align:center;color:#484f58;font-size:.75rem;margin-top:3rem}
  footer a{color:#58a6ff;text-decoration:none}
</style>
</head>
<body>

<h1>📊 tinyizer benchmarks</h1>
<p class="sub">output sizes in bytes — lower is better. auto-updated from CI.</p>

<div class="chart-wrap">
  <h2>per-page output size comparison</h2>
  <canvas id="barChart"></canvas>
</div>

<div class="chart-wrap">
  <h2>reduction percentage per tool</h2>
  <canvas id="pctChart"></canvas>
</div>

<table>
  <thead>
     <tr><th>tool</th><th>test_page.html</th><th>test_page2.html</th><th>test_page3.html</th><th>history</th></tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<footer>
  <p>built by <a href="https://github.com/almatamagotchi">alma tamagotchi</a> · data from <a href="https://github.com/almatamagotchi/tinyizer">tinyizer</a></p>
</footer>

<script>
fetch('data.json')
  .then(r => r.json())
  .then(data => {
    const tools = ['tinyizer','pipeline','html-minifier-terser','cminify'];
    const pages = ['test_page.html','test_page2.html','test_page3.html'];
    const colors = {'tinyizer':'#58a6ff','pipeline':'#f0883e','html-minifier-terser':'#da3633','cminify':'#8b949e'};
    const labels = ['page1 (2KB)','page2 (0.5KB)','page3 (0.4KB)'];

    // table
    const tb = document.getElementById('tableBody');
    const hist = data.history;
    const prevEntry = hist && hist.length >= 2 ? hist[hist.length - 2] : null;
    const curEntry = hist && hist.length >= 1 ? hist[hist.length - 1] : null;

    tools.forEach(t => {
      const row = tb.insertRow();
      row.insertCell().textContent = t;

      let deltas = [];
      pages.forEach(p => {
        const cell = row.insertCell();
        const curVal = data.tools[t][p];
        let txt = String(curVal);

        // trend delta from previous history entry
        if (prevEntry && curEntry && t === 'tinyizer') {
          const prev = prevEntry.tinyizer[p];
          const cur = curEntry.tinyizer[p];
          const diff = cur - prev;
          if (diff !== 0) {
            const arrow = diff < 0 ? '↓' : '↑';
            txt += ` <span class="delta ${diff<0?'down':'up'}">${arrow}${Math.abs(diff)}</span>`;
            deltas.push(diff);
          } else {
            txt += ' <span class="delta flat">·0</span>';
            deltas.push(0);
          }
        } else if (prevEntry && curEntry && t === 'pipeline') {
          const prev = prevEntry.pipeline ? prevEntry.pipeline[p] : null;
          const cur = curEntry.pipeline ? curEntry.pipeline[p] : null;
          if (prev != null && cur != null) {
            const diff = cur - prev;
            if (diff !== 0) {
              const arrow = diff < 0 ? '↓' : '↑';
              txt += ` <span class="delta ${diff<0?'down':'up'}">${arrow}${Math.abs(diff)}</span>`;
            } else {
              txt += ' <span class="delta flat">·0</span>';
            }
          }
        }

        cell.innerHTML = txt;
        if (t === 'tinyizer') cell.classList.add('win');
        else if (t === 'pipeline') cell.classList.add(data.tools.tinyizer[p] < data.tools.pipeline[p] ? 'win' : 'lose');
      });

      // history sparkline column
      const histCell = row.insertCell();
      if (hist && hist.length >= 2) {
        const svgW = 60, svgH = 24;
        const pad = 2;
        const points = hist.map(e => {
          const pdata = t === 'tinyizer' ? e.tinyizer : (t === 'pipeline' ? (e.pipeline || {}) : (e.tools?.[t] || {}));
          if (!pdata) return null;
          const total = (pdata['test_page.html']||0) + (pdata['test_page2.html']||0) + (pdata['test_page3.html']||0);
          return isNaN(total) ? null : total;
        }).filter(p => p !== null);
        if (points.length >= 2) {
          const min = Math.min(...points);
          const max = Math.max(...points);
          const range = max - min || 1;
          const xScale = (svgW - 2*pad) / (points.length - 1);
          let pathD = '';
          points.forEach((v, i) => {
            const x = pad + i * xScale;
            const y = pad + (svgH - 2*pad) * (1 - (v - min) / range);
            pathD += (i === 0 ? 'M' : 'L') + x + ',' + y + ' ';
          });
          const trendDown = points[points.length-1] < points[0];
          const stroke = t === 'tinyizer' ? '#58a6ff' : (trendDown ? '#3fb950' : '#f85149');
          histCell.innerHTML = `<span class="sparkline"><svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}"><polyline points="${points.map((v,i)=>{const x=pad+i*xScale;const y=pad+(svgH-2*pad)*(1-(v-min)/range);return x+','+y;}).join(' ')}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pad+0*xScale}" cy="${pad+(svgH-2*pad)*(1-(points[0]-min)/range)}" r="1.5" fill="${stroke}"/><circle cx="${pad+(points.length-1)*xScale}" cy="${pad+(svgH-2*pad)*(1-(points[points.length-1]-min)/range)}" r="1.5" fill="${stroke}"/></svg></span>`;
        } else {
          histCell.innerHTML = '<span class="delta flat">—</span>';
        }
      } else {
        histCell.innerHTML = '<span class="delta flat">—</span>';
      }
    });

    // bar chart
    new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: tools.map(t => ({
          label: t,
          data: pages.map(p => data.tools[t][p]),
          backgroundColor: colors[t],
          borderColor: colors[t],
          borderWidth: 0
        }))
      },
      options: {
        responsive: true,
        plugins: {
          legend: {labels:{color:'#c9d1d9'}}
        },
        scales: {
          x: {ticks:{color:'#8b949e'},grid:{color:'#21262d'}},
          y: {title:{text:'bytes',display:true,color:'#8b949e'},ticks:{color:'#8b949e'},grid:{color:'#21262d'},beginAtZero:true}
        }
      }
    });

    // percentage chart
    new Chart(document.getElementById('pctChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: tools.map(t => ({
          label: t,
          data: pages.map(p => {
            const input = data.input_sizes[p];
            const output = data.tools[t][p];
            return parseFloat(((input - output) / input * 100).toFixed(1));
          }),
          backgroundColor: colors[t],
          borderWidth: 0
        }))
      },
      options: {
        responsive: true,
        plugins: {
          legend: {labels:{color:'#c9d1d9'}}
        },
        scales: {
          x: {ticks:{color:'#8b949e'},grid:{color:'#21262d'}},
          y: {title:{text:'% reduction',display:true,color:'#8b949e'},ticks:{color:'#8b949e',callback:v=>v+'%'},grid:{color:'#21262d'},beginAtZero:true,max:100}
        }
      }
    });

    // history line chart (tinyizer + pipeline trends)
    if (data.history && data.history.length > 1) {
      const histWrap = document.createElement('div');
      histWrap.className = 'chart-wrap';
      histWrap.innerHTML = '<h2>size trends over time</h2><canvas id="histChart"></canvas>';
      document.querySelector('footer').before(histWrap);

      const histLabels = data.history.map(e => e.sha.slice(0,7));
      const pageNames = ['test_page.html','test_page2.html','test_page3.html'];
      const pageColors = ['#58a6ff','#f0883e','#3fb950'];
      const pipeColors = ['#79c0ff','#d2a15a','#56d364'];

      const datasets = [];
      pageNames.forEach((p,i) => {
        datasets.push({
          label: 'tinyizer ' + ['page1','page2','page3'][i],
          data: data.history.map(e => e.tinyizer[p]),
          borderColor: pageColors[i],
          backgroundColor: pageColors[i]+'22',
          tension: 0.2,
          pointRadius: 2,
          borderWidth: 2
        });
      });
      pageNames.forEach((p,i) => {
        datasets.push({
          label: 'pipeline ' + ['page1','page2','page3'][i],
          data: data.history.map(e => e.pipeline ? e.pipeline[p] : null),
          borderColor: pipeColors[i],
          backgroundColor: 'transparent',
          tension: 0.2,
          pointRadius: 1,
          borderWidth: 1,
          borderDash: [4,4]
        });
      });

      new Chart(document.getElementById('histChart'), {
        type: 'line',
        data: { labels: histLabels, datasets },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#c9d1d9' } },
            tooltip: {
              callbacks: {
                title: ctx => 'commit ' + data.history[ctx[0].dataIndex].sha.slice(0,7),
                afterTitle: ctx => data.history[ctx[0].dataIndex].ts.replace('T',' ').replace('Z','')
              }
            }
          },
          scales: {
            x: { ticks: { color: '#8b949e', maxRotation: 45, font: { size: 9 } }, grid: { color: '#21262d' } },
            y: { title: { text: 'bytes', display: true, color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' }, beginAtZero: false }
          }
        }
      });
    }

    // fix pipeline case mismatch (CI pushes "Pipeline", code expects "pipeline")
    function pipelineKey(data) {
      if (data.tools.pipeline) return data.tools.pipeline;
      if (data.tools.Pipeline) return data.tools.Pipeline;
      return {};
    }
  });
</script>
</body>
</html>
